# HTTP context only. The root-owned map is generated on the existing host.
include /etc/nginx/cosmotech-kestra-viewer-auth.map;

# An already signed-in administrator never depends on the operator adapter.
# Login retries to the unchanged native endpoint if the adapter is unavailable.
upstream cosmotech_kestra_login {
    server 127.0.0.1:8095 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:8081 backup;
}
