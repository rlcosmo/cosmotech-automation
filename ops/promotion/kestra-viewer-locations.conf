# Include only in the existing Kestra virtual host; do not change its UI frontend.
location = /api/v1/login {
    proxy_pass http://cosmotech_kestra_login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
    client_max_body_size 8k;
    proxy_connect_timeout 1s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store" always;
}

location = /api/v1/logout {
    proxy_pass http://cosmotech_kestra_login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
    client_max_body_size 8k;
    proxy_connect_timeout 1s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store" always;
}

location = /api/v1/configs/login {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
}

location ^~ /api/ {
    error_page 418 = @cosmotech_kestra_viewer;
    if ($cookie_COSMOTECH_KV != "") { return 418; }
    # Existing administrator cookies/Authorization go directly to native Kestra.
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cosmotech_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @cosmotech_kestra_viewer {
    set $cosmotech_view_method $request_method;
    set $cosmotech_view_path $uri;
    auth_request /_cosmotech/kestra_view_auth;
    auth_request_set $cosmotech_view_role $upstream_http_x_cosmotech_role;
    auth_request_set $cosmotech_view_cookie $upstream_http_x_cosmotech_cookie;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cosmotech_forwarded_proto;
    proxy_set_header Authorization $cosmotech_view_authorization;
    proxy_set_header Cookie $cosmotech_view_cookie;
    proxy_hide_header Set-Cookie;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    error_page 403 = @cosmotech_kestra_read_only;
}

location = /_cosmotech/kestra_view_auth {
    internal;
    proxy_pass http://127.0.0.1:8095/_kestra/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-Method $cosmotech_view_method;
    proxy_set_header X-Original-Path $cosmotech_view_path;
    proxy_set_header X-Original-Origin $http_origin;
}

location @cosmotech_kestra_read_only {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"message":"Conta de consulta. Aprovar, rejeitar e solicitar rollback pelo portal operacional."}';
}
