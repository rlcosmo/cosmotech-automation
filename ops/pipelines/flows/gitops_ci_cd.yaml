id: gitops_ci_cd
namespace: cosmotech.clusters.argocd_management
description: Esteira real de gitops para aws-eks-istio-lab-dev. Sem aprovações. Etapas observam resultados reais
  do GitHub Actions e Argo CD. Logs detalhados pelo link de execução GitHub; falhas não são convertidas em sucesso.
labels:
  cluster: argocd-management-k3s
  environment: dev
  application: gitops
  approval: disabled
  target_cluster: aws-eks-istio-lab-dev
inputs:
- id: run_id
  type: STRING
- id: run_attempt
  type: STRING
  defaults: '1'
- id: commit_sha
  type: STRING
tasks:
- id: source_execution
  type: io.kestra.plugin.core.log.Log
  message: Cluster aws-eks-istio-lab-dev | gitops | commit {{ inputs.commit_sha }} | https://github.com/rlcosmo/cosmotech-gitops/actions/runs/{{
    inputs.run_id }}/attempts/{{ inputs.run_attempt }}
- id: validate
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.1'
    memory:
      memory: 128MB
  env:
    PIPELINE_APP: gitops
    PIPELINE_RUN: '{{ inputs.run_id }}'
    PIPELINE_ATTEMPT: '{{ inputs.run_attempt }}'
    PIPELINE_STAGE: validate
  inputFiles:
    wait_stage.py: "\"\"\"Observe a real CI stage; never execute or approve a deployment.\"\"\"\nimport json\nimport\
      \ os\nimport re\nimport time\nimport urllib.request\n\napp = os.environ['PIPELINE_APP']\nrun_id = os.environ['PIPELINE_RUN']\n\
      attempt = os.environ['PIPELINE_ATTEMPT']\nstage = os.environ['PIPELINE_STAGE']\nassert app in {'orders-api',\
      \ 'orders-worker', 'gitops'}\nassert re.fullmatch(r'[0-9]+', run_id) and re.fullmatch(r'[0-9]+', attempt)\n\
      assert re.fullmatch(r'[a-z_]+', stage)\nurl = f'http://127.0.0.1:8094/{app}/{run_id}/{attempt}'\ntimeout =\
      \ 86400 if app != 'gitops' and stage == 'gitops' else 1800\ndeadline = time.monotonic() + timeout\nlast_state\
      \ = 'pending'\nwhile time.monotonic() < deadline:\n    try:\n        with urllib.request.urlopen(url, timeout=5)\
      \ as response:\n            record = json.load(response)\n    except (OSError, ValueError):\n        time.sleep(5)\n\
      \        continue\n    current = record.get('stages', {}).get(stage, {})\n    status = current.get('state',\
      \ 'pending')\n    if status != last_state:\n        print(json.dumps({'stage': stage, 'state': status, 'source':\
      \ record.get('url'), 'release_execution_id': record.get('release_execution_id')}), flush=True)\n        last_state\
      \ = status\n    if status == 'success':\n        print(json.dumps({'stage': stage, **current, 'source': record['url'],\
      \ 'commit': record['sha'], 'cluster': record['cluster']}))\n        break\n    if status in {'failure', 'cancelled',\
      \ 'skipped'} or record.get('state') in {'failure', 'cancelled'}:\n        print(json.dumps({'stage': stage,\
      \ 'state': status, 'pipeline_state': record.get('state'), 'source': record.get('url')}))\n        raise SystemExit('Source\
      \ pipeline did not successfully complete this stage')\n    time.sleep(5)\nelse:\n    raise SystemExit(f'Timed\
      \ out after {timeout}s waiting for {app} run {run_id} attempt {attempt} stage {stage}; last state={last_state}.\
      \ Check the linked release/approval and evidence service; no success was fabricated')\n"
  commands:
  - python wait_stage.py
- id: rollout
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: host
    cpu:
      cpus: '0.1'
    memory:
      memory: 128MB
  env:
